<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="MI_Hq14iBWIEFl1lyAjPv81ga14D-JDykYDLoLaC3g" />
    
    <title>CnStream - Películas y Series Online</title>
    <meta name="description" content="Disfruta de las mejores películas y series en CnStream. Tu plataforma de entretenimiento online en alta calidad.">
    <meta name="keywords" content="CnStream, ver peliculas online, cine, peliculas gratis, series">
    <meta name="robots" content="index, follow">

    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <link rel="shortcut icon" href="/static/img/logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="/static/img/logo.png">

    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #141414;
      color: #ffffff;
      padding: 20px 40px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      height: 42px;
      width: auto;
      object-fit: contain;
      filter: brightness(1.2) contrast(150%);
      mix-blend-mode: lighten;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-text span { color: #E50914; }

    .search-box {
      background: #000000;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 8px 18px;
      width: 280px;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 100%;
      font-size: 14px;
    }

    .main-title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-top: 30px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background-color: #E50914;
      border-radius: 2px;
    }

    /* CARRUSEL DE DESTACADOS (3D OVERLAP SLIDER) */
    .featured-wrapper {
      position: relative;
      width: 100%;
      padding: 20px 0 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-slider-3d {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .hero-card-3d {
      position: absolute;
      width: 580px;
      height: 310px;
      border-radius: 14px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border: 1px solid #333;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease, z-index 0.6s;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.6) translateX(0);
      z-index: 1;
      pointer-events: none;
    }

    .hero-card-3d.active {
      opacity: 1;
      transform: scale(1) translateX(0);
      z-index: 10;
      pointer-events: auto;
      border-color: #444;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
    }

    .hero-card-3d.prev {
      opacity: 0.45;
      transform: scale(0.82) translateX(-55%);
      z-index: 5;
      pointer-events: auto;
      filter: brightness(0.6);
    }

    .hero-card-3d.next {
      opacity: 0.45;
      transform: scale(0.82) translateX(55%);
      z-index: 5;
      pointer-events: auto;
      filter: brightness(0.6);
    }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 15%, rgba(0,0,0,0.4) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
    }

    .hero-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .hero-desc {
      font-size: 13px;
      color: #ccc;
      line-clamp: 2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
    }

    .btn-hero-play {
      background: #E50914;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-hero-fav {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .carousel-dots {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      z-index: 20;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    .carousel-dot.active {
      background: #E50914;
      transform: scale(1.3);
    }

    /* GRID DE CONTENIDO DE PELÍCULAS Y SERIES */
    .empty-msg {
      color: #757575;
      font-size: 15px;
      margin-left: 14px;
      margin-bottom: 20px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .movie-card {
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .poster-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .card-info { padding: 12px; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .edit-controls {
      display: none;
      padding: 0 12px 12px 12px;
      gap: 8px;
    }

    .edit-mode .edit-controls { display: flex; }

    .btn-danger {
      background: #E50914;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      flex: 1;
    }

    /* PANELES DE CONTROL / MODALES */
    .auth-overlay, .secret-panel, .info-overlay, .player-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .auth-card, .panel-box {
      background: #181818;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
    }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
    }

    .form-group input, .form-group textarea, .auth-card input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2b2b2b;
      color: #fff;
      outline: none;
    }

    .btn-red {
      background: #E50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      body { padding: 12px 15px; }
      header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .search-box { width: 100%; }
      .main-title { font-size: 24px; }
      .hero-slider-3d { height: 230px; }
      .hero-card-3d { width: 85%; height: 210px; }
      .hero-card-3d.prev { transform: scale(0.8) translateX(-35%); }
      .hero-card-3d.next { transform: scale(0.8) translateX(35%); }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .poster-img { height: 190px; }
    }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAll6C8PPZtf02uYX2DUssS0TVA-S0f0b4",
        authDomain: "cinestream-b7d94.firebaseapp.com",
        databaseURL: "https://cinestream-b7d94-default-rtdb.firebaseio.com",
        projectId: "cinestream-b7d94",
        storageBucket: "cinestream-b7d94.firebasestorage.app",
        messagingSenderId: "237145922828",
        appId: "1:237145922828:web:50b9f3396816ae4bdbbd29",
        measurementId: "G-VJSZGZMN3E"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.db = db;
      window.dbRef = ref;
      window.dbPush = push;
      window.dbOnValue = onValue;
      window.dbRemove = remove;
    </script>
</head>
<body>

<header>
  <div class="logo-box">
    <img src="/static/img/logo.png" alt="logo" class="logo-icon">
    <div class="logo-text">Cn<span>Stream</span></div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar película o serie..." onkeyup="filterContent()">
  </div>
</header>

<h1 class="main-title">Catálogo de Entretenimiento</h1>

<div class="section-title">destacados</div>
<div class="featured-wrapper">
  <div id="featuredContainer" class="hero-slider-3d"></div>
  <div id="carouselDots" class="carousel-dots"></div>
  <div id="noFeaturedMsg" class="empty-msg" style="display:none;">No hay contenido destacado actualmente.</div>
</div>

<div class="section-title">Películas</div>
<div id="moviesContainer" class="movie-grid"></div>
<div id="noMoviesMsg" class="empty-msg">No hay películas.</div>

<div class="section-title">Series</div>
<div id="seriesContainer" class="movie-grid"></div>
<div id="noSeriesMsg" class="empty-msg">No hay series.</div>

<div class="auth-overlay" id="authModal">
  <div class="auth-card">
    <h3>Acceso Restringido</h3>
    <input type="password" id="authPassword" placeholder="Contraseña de administrador">
    <p id="authError" style="color:#E50914; font-size:12px; display:none; margin-top:8px;">Contraseña incorrecta</p>
    <button class="btn-red" style="margin-top:15px;" onclick="verifyPassword()">Ingresar</button>
    <button style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; cursor:pointer;" onclick="closeAuthModal()">Cancelar</button>
  </div>
</div>

<div class="secret-panel" id="featuredSecretPanel">
  <div class="panel-box">
    <h3>Agregar a Destacados</h3>
    <form id="featuredForm" onsubmit="saveFeatured(event)">
      <div class="form-group"><label>Título:</label><input type="text" id="featuredTitle" required></div>
      <div class="form-group"><label>Enlace de Video (.mp4 / iframe):</label><input type="text" id="featuredSource" required></div>
      <div class="form-group"><label>Sinopsis:</label><textarea id="featuredDesc" rows="3"></textarea></div>
      <div class="form-group"><label>Imagen Portada (URL):</label><input type="text" id="featuredPosterUrl" required></div>
      <button type="submit" class="btn-red">Guardar Destacado</button>
      <button type="button" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; cursor:pointer;" onclick="closePanel('featuredSecretPanel')">Cerrar</button>
    </form>
  </div>
</div>

<script>
  const pressedKeys = new Set();
  let isEditMode = false;
  let pendingPanelTarget = null;
  const SECRET_KEY = "Barcelona10";
  
  let catalog = { featured: {}, movies: {}, series: {} };
  let currentFeaturedIndex = 0;
  let autoRotateTimer = null;

  window.addEventListener('load', () => {
    const checkFirebase = setInterval(() => {
      if (window.db) {
        clearInterval(checkFirebase);
        listenToFirebase();
      }
    }, 100);
  });

  function listenToFirebase() {
    window.dbOnValue(window.dbRef(window.db, 'catalog'), (snapshot) => {
      const data = snapshot.val() || { featured: {}, movies: {}, series: {} };
      catalog = data;
      renderFeatured();
      renderMedia('movies');
      renderMedia('series');
    });
  }

  // CONTROLES DE TECLADO
  window.addEventListener('keydown', (e) => {
    pressedKeys.add(e.key.toLowerCase());
    if (pressedKeys.has('v') && pressedKeys.has('i') && pressedKeys.has('p')) requestAccess('featuredSecretPanel');
    if (pressedKeys.has('r') && pressedKeys.has('k') && pressedKeys.has('j') && pressedKeys.has('p')) requestAccess('moviesSecretPanel');
    if (pressedKeys.has('z') && pressedKeys.has('c') && pressedKeys.has('b')) requestAccess('seriesSecretPanel');
    if (pressedKeys.has('1') && pressedKeys.has('0')) requestAccess('toggleEditMode');
  });

  window.addEventListener('keyup', (e) => pressedKeys.delete(e.key.toLowerCase()));

  function requestAccess(target) {
    pendingPanelTarget = target;
    document.getElementById('authPassword').value = '';
    document.getElementById('authError').style.display = 'none';
    document.getElementById('authModal').style.display = 'flex';
    document.getElementById('authPassword').focus();
  }

  function verifyPassword() {
    if (document.getElementById('authPassword').value === SECRET_KEY) {
      document.getElementById('authModal').style.display = 'none';
      if (pendingPanelTarget === 'toggleEditMode') {
        isEditMode = !isEditMode;
        document.body.classList.toggle('edit-mode', isEditMode);
      } else if (pendingPanelTarget) {
        document.getElementById(pendingPanelTarget).style.display = 'flex';
      }
      pendingPanelTarget = null;
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }

  function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
  function closePanel(panelId) { document.getElementById(panelId).style.display = 'none'; }

  // RENDER CARRUSEL DESTACADOS EN PERSPECTIVA 3D
  function renderFeatured() {
    const container = document.getElementById('featuredContainer');
    const dotsContainer = document.getElementById('carouselDots');
    const emptyMsg = document.getElementById('noFeaturedMsg');
    const items = catalog.featured || {};
    const keys = Object.keys(items);

    container.innerHTML = '';
    dotsContainer.innerHTML = '';
    clearInterval(autoRotateTimer);

    if (keys.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }

    emptyMsg.style.display = 'none';

    keys.forEach((key, index) => {
      const item = items[key];
      const bgStyle = item.poster ? `background-image: url('${item.poster}');` : 'background:#222;';
      
      const card = document.createElement('div');
      card.className = 'hero-card-3d';
      card.style = bgStyle;
      card.setAttribute('data-index', index);
      card.onclick = () => setFeaturedSlide(index);

      card.innerHTML = `
        <div class="hero-overlay">
          <div class="hero-title">${item.title}</div>
          <div class="hero-desc">${item.desc || 'Sin descripción'}</div>
          <div class="hero-actions">
            <button class="btn-hero-play">▶ VER AHORA</button>
            <button class="btn-hero-fav">+ MIS FAVORITOS</button>
          </div>
        </div>
        <div class="edit-controls" style="position:absolute; top:10px; right:10px; z-index:20;">
          <button class="btn-danger" onclick="event.stopPropagation(); deleteMediaItem('featured', '${key}')">Eliminar</button>
        </div>
      `;

      container.appendChild(card);

      const dot = document.createElement('div');
      dot.className = 'carousel-dot';
      dot.onclick = () => setFeaturedSlide(index);
      dotsContainer.appendChild(dot);
    });

    if (currentFeaturedIndex >= keys.length) currentFeaturedIndex = 0;
    updateFeaturedClasses(keys.length);

    autoRotateTimer = setInterval(() => {
      currentFeaturedIndex = (currentFeaturedIndex + 1) % keys.length;
      updateFeaturedClasses(keys.length);
    }, 5000);
  }

  function setFeaturedSlide(index) {
    currentFeaturedIndex = index;
    const keys = Object.keys(catalog.featured || {});
    updateFeaturedClasses(keys.length);
  }

  function updateFeaturedClasses(total) {
    const cards = document.querySelectorAll('.hero-card-3d');
    const dots = document.querySelectorAll('.carousel-dot');

    cards.forEach((card, i) => {
      card.classList.remove('active', 'prev', 'next');
      if (dots[i]) dots[i].classList.remove('active');

      if (i === currentFeaturedIndex) {
        card.classList.add('active');
        if (dots[i]) dots[i].classList.add('active');
      } else if (i === (currentFeaturedIndex - 1 + total) % total) {
        card.classList.add('prev');
      } else if (i === (currentFeaturedIndex + 1) % total) {
        card.classList.add('next');
      }
    });
  }

  // RENDER DE SECCIONES PELÍCULAS Y SERIES
  function renderMedia(type) {
    const isMovie = type === 'movies';
    const container = document.getElementById(isMovie ? 'moviesContainer' : 'seriesContainer');
    const emptyMsg = document.getElementById(isMovie ? 'noMoviesMsg' : 'noSeriesMsg');
    const items = catalog[type] || {};
    const keys = Object.keys(items);

    container.innerHTML = '';
    if (keys.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      keys.forEach(key => {
        const item = items[key];
        const posterHTML = item.poster ? `<img src="${item.poster}" class="poster-img" alt="Portada">` : '<div class="poster-img" style="background:#222;"></div>';
        
        container.innerHTML += `
          <div class="movie-card">
            <div>
              ${posterHTML}
              <div class="card-info">
                <div class="card-title">${item.title}</div>
              </div>
            </div>
            <div class="edit-controls">
              <button class="btn-danger" onclick="deleteMediaItem('${type}', '${key}')">Eliminar</button>
            </div>
          </div>
        `;
      });
    }
  }

  // GUARDAR / ELIMINAR BASE DE DATOS
  function saveFeatured(e) {
    e.preventDefault();
    const title = document.getElementById('featuredTitle').value;
    const source = document.getElementById('featuredSource').value;
    const desc = document.getElementById('featuredDesc').value;
    const poster = document.getElementById('featuredPosterUrl').value;

    window.dbPush(window.dbRef(window.db, 'catalog/featured'), { title, source, desc, poster })
      .then(() => {
        closePanel('featuredSecretPanel');
        document.getElementById('featuredForm').reset();
      });
  }

  function deleteMediaItem(type, key) {
    if (confirm("¿Deseas eliminar este elemento?")) {
      window.dbRemove(window.dbRef(window.db, `catalog/${type}/${key}`));
    }
  }

  function filterContent() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.movie-card').forEach(card => {
      const title = card.querySelector('.card-title').innerText.toLowerCase();
      card.style.display = title.includes(query) ? '' : 'none';
    });
  }
</script>
