<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #141414;
      color: #ffffff;
      padding: 20px 40px;
    }

    /* Header y Navegación */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #E50914;
    }

    .search-box {
      background: #000000;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 8px 18px;
      width: 260px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 100%;
      font-size: 14px;
    }

    .main-title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    /* Secciones */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-top: 30px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background-color: #E50914;
      border-radius: 2px;
    }

    .empty-msg {
      color: #757575;
      font-size: 15px;
      margin-left: 14px;
      margin-bottom: 20px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .movie-card {
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .poster-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Controles de Edición */
    .edit-controls {
      display: none;
      padding: 0 12px 12px 12px;
      gap: 8px;
    }

    .edit-mode .edit-controls {
      display: flex;
    }

    .btn-danger {
      background: #E50914;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      flex: 1;
    }

    /* Modales de Autenticación y Paneles Secretos */
    .auth-overlay, .secret-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .auth-card, .panel-box {
      background: #181818;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
    }

    .panel-box h3, .auth-card h3 {
      margin-bottom: 15px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
    }

    .form-group input, .form-group textarea, .auth-card input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2b2b2b;
      color: #fff;
      outline: none;
    }

    .btn-red {
      background: #E50914;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* Modal Banner de Información Estilo Película */
    .info-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .info-banner {
      position: relative;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      background: #181818;
      border: 1px solid #282828;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }

    .banner-hero {
      position: relative;
      width: 100%;
      height: 380px;
      background-size: cover;
      background-position: center;
    }

    .banner-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(24,24,24,0.1) 0%, rgba(24,24,24,0.85) 70%, #181818 100%);
    }

    .banner-content {
      position: relative;
      padding: 0 40px 40px 40px;
      margin-top: -100px;
    }

    .banner-title {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.9);
    }

    .banner-tags {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .tag-hd {
      border: 1px solid #757575;
      color: #ccc;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .tag-badge {
      background: #E50914;
      color: white;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .banner-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #cccccc;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-play:hover {
      background: #e6e6e6;
      transform: scale(1.03);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #181818;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* Modal Player Video */
    .player-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }

    .player-container {
      width: 90%;
      max-width: 960px;
      position: relative;
    }

    video, iframe {
      width: 100%;
      height: 520px;
      background: black;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Cine<span>Stream</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar película o serie..." onkeyup="filterContent()">
    </div>
  </header>

  <h1 class="main-title">Catálogo de Entretenimiento</h1>

  <!-- Películas -->
  <div class="section-title">Películas</div>
  <div id="moviesContainer" class="movie-grid"></div>
  <div id="noMoviesMsg" class="empty-msg">No hay películas.</div>

  <!-- Series -->
  <div class="section-title">Series</div>
  <div id="seriesContainer" class="movie-grid"></div>
  <div id="noSeriesMsg" class="empty-msg">No hay series.</div>

  <!-- Modal de Seguridad Password -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <h3>Acceso Restringido</h3>
      <input type="password" id="authPassword" placeholder="Contraseña de administrador">
      <p id="authError" style="color:#E50914; font-size:12px; display:none; margin-top:8px;">Contraseña incorrecta</p>
      <button class="btn-red" style="margin-top:15px;" onclick="verifyPassword()">Ingresar</button>
      <button style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; cursor:pointer;" onclick="closeAuthModal()">Cancelar</button>
    </div>
  </div>

  <!-- Panel Secreto Películas (R + K + J + P) -->
  <div class="secret-panel" id="moviesSecretPanel">
    <div class="panel-box">
      <h3>Agregar Película</h3>
      <form id="movieForm">
        <div class="form-group">
          <label>Título:</label>
          <input type="text" id="movieTitle" required>
        </div>
        <div class="form-group">
          <label>Enlace de Video (URL de iframe / embed / mp4):</label>
          <input type="text" id="movieSource" required>
        </div>
        <div class="form-group">
          <label>Descripción / Sinopsis:</label>
          <textarea id="movieDesc" rows="3" placeholder="Escribe de qué trata la película..."></textarea>
        </div>
        <div class="form-group">
          <label>Imagen de Portada / Banner (desde tu PC):</label>
          <input type="file" id="moviePoster" accept="image/*">
        </div>
        <button type="submit" class="btn-red">Guardar Película</button>
        <button type="button" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; cursor:pointer;" onclick="closePanel('moviesSecretPanel')">Cerrar</button>
      </form>
    </div>
  </div>

  <!-- Panel Secreto Series (Z + C + B) -->
  <div class="secret-panel" id="seriesSecretPanel">
    <div class="panel-box">
      <h3>Agregar Serie / Episodio</h3>
      <form id="seriesForm">
        <div class="form-group">
          <label>Título de Serie / Capítulo:</label>
          <input type="text" id="seriesTitle" required>
        </div>
        <div class="form-group">
          <label>Enlace de Video (URL de iframe / embed / mp4):</label>
          <input type="text" id="seriesSource" required>
        </div>
        <div class="form-group">
          <label>Descripción / Sinopsis:</label>
          <textarea id="seriesDesc" rows="3" placeholder="Escribe de qué trata..."></textarea>
        </div>
        <div class="form-group">
          <label>Imagen de Portada / Banner (desde tu PC):</label>
          <input type="file" id="seriesPoster" accept="image/*">
        </div>
        <button type="submit" class="btn-red">Guardar Serie</button>
        <button type="button" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; cursor:pointer;" onclick="closePanel('seriesSecretPanel')">Cerrar</button>
      </form>
    </div>
  </div>

  <!-- Vista Previa de Información (Estilo Banner) -->
  <div class="info-overlay" id="infoModal">
    <div class="info-banner">
      <button class="close-btn" onclick="closeInfoModal()">&times;</button>
      <div class="banner-hero" id="infoHero">
        <div class="banner-gradient"></div>
      </div>
      <div class="banner-content">
        <h1 class="banner-title" id="infoTitle">Título</h1>
        <div class="banner-tags">
          <span class="tag-badge" id="infoBadge">Película</span>
          <span class="tag-hd">HD</span>
        </div>
        <p class="banner-desc" id="infoDesc">Sin descripción disponible.</p>
        <button class="btn-play" id="infoPlayBtn">
          ▶ ver trailer / reproducir
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Reproductor de Video -->
  <div class="player-overlay" id="playerModal">
    <div class="player-container">
      <button class="close-btn" style="top: -45px; right: 0;" onclick="closePlayer()">&times;</button>
      <video id="localVideoPlayer" controls autoplay style="display: none;"></video>
      <iframe id="iframeVideoPlayer" src="" allowfullscreen referrerpolicy="no-referrer" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    const pressedKeys = new Set();
    let isEditMode = false;
    let pendingPanelTarget = null;
    const SECRET_KEY = "Barcelona10";

    document.addEventListener('DOMContentLoaded', () => {
      renderMedia('movies');
      renderMedia('series');
    });

    // Teclas de Acceso Directo
    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.key.toLowerCase());

      if (pressedKeys.has('r') && pressedKeys.has('k') && pressedKeys.has('j') && pressedKeys.has('p')) {
        requestAccess('moviesSecretPanel');
      }

      if (pressedKeys.has('z') && pressedKeys.has('c') && pressedKeys.has('b')) {
        requestAccess('seriesSecretPanel');
      }

      if (pressedKeys.has('1') && pressedKeys.has('0')) {
        isEditMode = !isEditMode;
        document.body.classList.toggle('edit-mode', isEditMode);
      }
    });

    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.key.toLowerCase());
    });

    // Control Contraseña
    function requestAccess(panelId) {
      pendingPanelTarget = panelId;
      document.getElementById('authPassword').value = '';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authModal').style.display = 'flex';
      document.getElementById('authPassword').focus();
    }

    function verifyPassword() {
      const enteredPass = document.getElementById('authPassword').value;
      if (enteredPass === SECRET_KEY) {
        document.getElementById('authModal').style.display = 'none';
        if (pendingPanelTarget) {
          document.getElementById(pendingPanelTarget).style.display = 'flex';
          pendingPanelTarget = null;
        }
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    function closePanel(panelId) {
      document.getElementById(panelId).style.display = 'none';
    }

    // Buscador
    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.movie-card').forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    }

    // Abrir Modal de Información (Previo a reproducir)
    function openInfoModal(type, index) {
      const data = JSON.parse(localStorage.getItem(type) || '[]');
      const item = data[index];
      if (!item) return;

      document.getElementById('infoTitle').innerText = item.title;
      document.getElementById('infoDesc').innerText = item.desc && item.desc.trim() !== '' ? item.desc : "Sin descripción disponible.";
      document.getElementById('infoBadge').innerText = type === 'movies' ? 'Película' : 'Serie';
      
      const hero = document.getElementById('infoHero');
      if (item.poster) {
        hero.style.backgroundImage = `url('${item.poster}')`;
      } else {
        hero.style.backgroundImage = 'none';
      }

      const playBtn = document.getElementById('infoPlayBtn');
      playBtn.onclick = () => {
        closeInfoModal();
        playMedia(item.src);
      };

      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    // Reproductor Dual
    function playMedia(url) {
      const modal = document.getElementById('playerModal');
      const videoTag = document.getElementById('localVideoPlayer');
      const iframeTag = document.getElementById('iframeVideoPlayer');

      if (url.startsWith('http')) {
        videoTag.style.display = 'none';
        videoTag.src = '';
        iframeTag.src = url;
        iframeTag.style.display = 'block';
      } else {
        iframeTag.style.display = 'none';
        iframeTag.src = '';
        videoTag.src = url;
        videoTag.style.display = 'block';
        videoTag.play().catch(e => console.log(e));
      }

      modal.style.display = 'flex';
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const videoTag = document.getElementById('localVideoPlayer');
      const iframeTag = document.getElementById('iframeVideoPlayer');

      if (videoTag) { videoTag.pause(); videoTag.src = ''; }
      if (iframeTag) { iframeTag.src = ''; }
      if (modal) modal.style.display = 'none';
    }

    // Renderizar Elementos
    function renderMedia(type) {
      const isMovie = type === 'movies';
      const container = document.getElementById(isMovie ? 'moviesContainer' : 'seriesContainer');
      const emptyMsg = document.getElementById(isMovie ? 'noMoviesMsg' : 'noSeriesMsg');
      const data = JSON.parse(localStorage.getItem(type) || '[]');
      
      container.innerHTML = '';

      if (data.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        data.forEach((item, index) => {
          const posterHTML = item.poster ? `<img src="${item.poster}" class="poster-img" alt="Portada">` : '<div class="poster-img" style="background:#222;"></div>';
          
          container.innerHTML += `
            <div class="movie-card">
              <div onclick="openInfoModal('${type}', ${index})">
                ${posterHTML}
                <div class="card-info">
                  <div class="card-title">${item.title}</div>
                </div>
              </div>
              <div class="edit-controls">
                <button class="btn-danger" onclick="deleteMediaItem('${type}', ${index})">Eliminar</button>
              </div>
            </div>
          `;
        });
      }
    }

    function getBase64(file) {
      return new Promise((resolve) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // Guardar Película
    document.getElementById('movieForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('movieTitle').value;
      const src = document.getElementById('movieSource').value;
      const desc = document.getElementById('movieDesc').value;
      const file = document.getElementById('moviePoster').files[0];
      const poster = await getBase64(file);

      saveToStorage('movies', { title, src, desc, poster });
      document.getElementById('movieForm').reset();
      closePanel('moviesSecretPanel');
    });

    // Guardar Serie
    document.getElementById('seriesForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('seriesTitle').value;
      const src = document.getElementById('seriesSource').value;
      const desc = document.getElementById('seriesDesc').value;
      const file = document.getElementById('seriesPoster').files[0];
      const poster = await getBase64(file);

      saveToStorage('series', { title, src, desc, poster });
      document.getElementById('seriesForm').reset();
      closePanel('seriesSecretPanel');
    });

    function saveToStorage(type, item) {
      const data = JSON.parse(localStorage.getItem(type) || '[]');
      data.push(item);
      localStorage.setItem(type, JSON.stringify(data));
      renderMedia(type);
    }

    function deleteMediaItem(type, index) {
      const data = JSON.parse(localStorage.getItem(type) || '[]');
      data.splice(index, 1);
      localStorage.setItem(type, JSON.stringify(data));
      renderMedia(type);
    }
  </script>
</body>
</html>
