<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a0c;
      --card-bg: rgba(22, 22, 28, 0.75);
      --primary: #ff0520;
      --primary-glow: rgba(255, 5, 32, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    header {
      position: fixed; top: 0; width: 100%; padding: 18px 50px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border); z-index: 100;
    }

    .brand { font-size: 1.8rem; font-weight: 800; }
    .brand span { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

    .edit-mode-badge {
      display: none; background: linear-gradient(135deg, var(--primary), #9e0013);
      color: white; padding: 6px 16px; border-radius: 30px; font-weight: 700; font-size: 0.8rem;
    }

    .hero { height: 16vh; display: flex; align-items: center; padding: 0 50px; margin-top: 80px; }
    .hero-title { font-size: 2.2rem; font-weight: 800; }

    .content-section { padding: 10px 50px 40px; }
    .section-title { font-size: 1.4rem; margin-bottom: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .section-title::before { content: ''; display: block; width: 4px; height: 20px; background: var(--primary); border-radius: 2px; }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; }

    .media-card {
      position: relative; background: var(--card-bg); border-radius: 14px;
      overflow: hidden; border: 1px solid var(--glass-border); transition: all 0.3s ease;
    }
    .media-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

    .cover-container { position: relative; width: 100%; height: 280px; cursor: pointer; overflow: hidden; }
    .cover-container img { width: 100%; height: 100%; object-fit: cover; }

    .media-info { padding: 14px; }
    .media-title { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-actions { display: none; position: absolute; top: 10px; right: 10px; z-index: 15; flex-direction: column; gap: 5px; }
    .body-edit-active .card-actions { display: flex; }

    .btn-action {
      background: rgba(10, 10, 12, 0.9); border: 1px solid var(--glass-border);
      color: white; padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; text-align: center;
    }
    .btn-action.add-ep { background: var(--primary); border: none; font-weight: bold; }
    .btn-action.edit-btn { background: #e67e22; border: none; font-weight: bold; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal {
      background: rgba(20, 20, 26, 0.95); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 30px; width: 90%; max-width: 500px;
    }

    .modal-series-detail { max-width: 750px; display: flex; gap: 25px; align-items: flex-start; }
    .series-cover-preview { width: 220px; height: 310px; border-radius: 12px; object-fit: cover; }
    
    .season-tabs { display: flex; gap: 10px; margin: 15px 0 10px 0; overflow-x: auto; padding-bottom: 5px; }
    .season-tab {
      padding: 6px 14px; background: rgba(255, 255, 255, 0.08); border-radius: 20px;
      font-size: 0.85rem; cursor: pointer; white-space: nowrap; border: 1px solid transparent;
    }
    .season-tab.active { background: var(--primary); font-weight: bold; }

    .episodes-list { max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .ep-item {
      padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      border: 1px solid var(--glass-border); transition: all 0.2s ease;
    }
    .ep-item:hover { background: rgba(255, 5, 32, 0.2); border-color: var(--primary); }

    .close-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; float: right; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); border-radius: 8px; color: white; }
    .form-row { display: flex; gap: 10px; }

    .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }

    video { width: 100%; height: 480px; border-radius: 10px; background: #000; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Cine<span>Stream</span></div>
    
<div class="search-box">
  <input type="text" id="searchInput" placeholder=" Buscar película o serie..." onkeyup="filterMedia()">
</div>

<style>
  .search-box input {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border);
    padding: 8px 16px;
    border-radius: 20px;
    color: white;
    outline: none;
    width: 250px;
    transition: all 0.3s ease;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 10px var(--primary-glow);
    width: 300px;
  }
</style>

    <div id="editBadge" class="edit-mode-badge">MODO EDICIÓN ACTIVO (1+0)</div>
  </header>

  <section class="hero">
    <h1 class="hero-title">Catálogo de Entretenimiento</h1>
  </section>

  <section class="content-section">
    <h2 class="section-title">Películas</h2>
    <div class="media-grid" id="movieGrid"></div>
  </section>

  <section class="content-section">
    <h2 class="section-title">Series</h2>
    <div class="media-grid" id="seriesGrid"></div>
  </section>

  <!-- Reproductor -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal" style="max-width: 900px;">
      <button class="close-btn" onclick="closePlayer()">&times;</button>
      <h2 id="playerTitle" style="margin-bottom: 15px;">Reproduciendo</h2>
      <video id="videoPlayer" controls controlsList="nodownload" oncontextmenu="return false;" playsinline></video>
    </div>
  </div>

  <!-- Detalle Serie -->
  <div class="modal-overlay" id="seriesDetailModal">
    <div class="modal modal-series-detail">
      <img id="detailSeriesCover" class="series-cover-preview" src="" alt="Portada">
      <div style="flex:1; width: 100%;">
        <button class="close-btn" onclick="closeModal('seriesDetailModal')">&times;</button>
        <h2 id="detailSeriesTitle">Nombre de Serie</h2>
        <div class="season-tabs" id="seasonTabs"></div>
        <div class="episodes-list" id="detailEpisodesList"></div>
      </div>
    </div>
  </div>

  <!-- Modal Película (R+K+J+P) -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal">
      <button class="close-btn" onclick="closeModal('movieModal')">&times;</button>
      <h2 style="margin-bottom:15px;">Subir Película</h2>
      <form onsubmit="handleUpload(event, '/upload/movie', 'movieModal')">
        <div class="form-group"><label>Título</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Portada</label><input type="file" name="cover" accept="image/*" required></div>
        <div class="form-group"><label>Video (MP4/MKV)</label><input type="file" name="video" accept=".mkv,.mp4" required></div>
        <button type="submit" class="btn-submit">Publicar Película</button>
      </form>
    </div>
  </div>

  <!-- Modal Serie (Z+C+B) -->
  <div class="modal-overlay" id="seriesModal">
    <div class="modal">
      <button class="close-btn" onclick="closeModal('seriesModal')">&times;</button>
      <h2 style="margin-bottom:15px;">Agregar Episodio a Serie</h2>
      <form onsubmit="handleUpload(event, '/upload/series', 'seriesModal')">
        <div class="form-group">
          <label>Título de la Serie</label>
          <input type="text" id="seriesFormTitle" name="title" placeholder="Ej: Stranger Things" required>
        </div>
        
        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label>Temporada</label>
            <input type="number" name="season" min="1" value="1" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label>N° Episodio</label>
            <input type="number" name="ep_num" min="1" value="1" required>
          </div>
        </div>

        <div class="form-group">
          <label>Nombre del Episodio (Opcional)</label>
          <input type="text" name="ep_title" placeholder="Ej: Capítulo 1: El comienzo">
        </div>

        <div class="form-group">
          <label>Portada (Opcional si la serie ya existe)</label>
          <input type="file" name="cover" accept="image/*">
        </div>

        <div class="form-group">
          <label>Video del Episodio (MP4/MKV)</label>
          <input type="file" name="video" accept=".mkv,.mp4" required>
        </div>

        <button type="submit" class="btn-submit">Guardar Episodio</button>
      </form>
    </div>
  </div>

  <script>
    const activeKeys = new Set();
    let editMode = false;
    let isAdminAuthenticated = false; // Estado de clave
    let globalCatalog = { movies: [], series: [] };
    let selectedSeriesId = null;
    let currentSeasonSelected = 1;

    document.addEventListener("DOMContentLoaded", loadCatalog);

    // Sistema de Autenticación Admin
    function checkAdminAuth(callback) {
      if (isAdminAuthenticated) {
        callback();
        return;
      }
      
      const password = prompt("🔒 Ingrese la contraseña de Administrador:");
      if (password === "Barcelona10") {
        isAdminAuthenticated = true;
        alert("✅ Acceso concedido.");
        callback();
      } else if (password !== null) {
        alert("❌ Contraseña incorrecta. Acceso denegado.");
      }
    }

    function loadCatalog() {
      fetch('/api/media?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          globalCatalog = data;
          renderMovies(data.movies);
          renderSeries(data.series);
        });
    }

function filterMedia() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();

  const filteredMovies = globalCatalog.movies.filter(m => 
    m.title.toLowerCase().includes(query)
  );

  const filteredSeries = globalCatalog.series.filter(s => 
    s.title.toLowerCase().includes(query)
  );

  renderMovies(filteredMovies);
  renderSeries(filteredSeries);
}

    function renderMovies(movies) {
      const container = document.getElementById('movieGrid');
      container.innerHTML = movies.length ? '' : '<p>No hay películas.</p>';
      movies.forEach(m => {
        container.innerHTML += `
          <div class="media-card">
            <div class="card-actions">
              <button class="btn-action edit-btn" onclick="editMovieTitle('${m.id}', '${m.title}')">✏️ Editar Nombre</button>
              <button class="btn-action" onclick="deleteMovie('${m.id}')">Eliminar</button>
            </div>
            <div class="cover-container" onclick="playVideo('${m.video_url}', '${m.title}')">
              <img src="${m.cover_url}">
            </div>
            <div class="media-info"><div class="media-title">${m.title}</div></div>
          </div>`;
      });
    }

    function renderSeries(series) {
      const container = document.getElementById('seriesGrid');
      container.innerHTML = series.length ? '' : '<p>No hay series.</p>';
      series.forEach(s => {
        container.innerHTML += `
          <div class="media-card">
            <div class="card-actions">
              <button class="btn-action edit-btn" onclick="editSeriesTitle('${s.id}', '${s.title}')">✏️ Editar Nombre</button>
              <button class="btn-action add-ep" onclick="quickAddEpisode('${s.title}')">+ Agregar Episodio</button>
              <button class="btn-action" onclick="deleteSeries('${s.id}')">Eliminar Serie</button>
            </div>
            <div class="cover-container" onclick="openSeriesDetail('${s.id}')">
              <img src="${s.cover_url}">
            </div>
            <div class="media-info">
              <div class="media-title">${s.title}</div>
              <span style="font-size:0.75rem; color:var(--primary); font-weight:bold;">${s.episodes ? s.episodes.length : 0} Episodios</span>
            </div>
          </div>`;
      });
    }

    // Funciones para editar nombre
    function editMovieTitle(id, currentTitle) {
      const newTitle = prompt("Escribe el nuevo nombre de la película:", currentTitle);
      if (newTitle && newTitle.trim() !== "" && newTitle !== currentTitle) {
        fetch(`/edit/movie/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle.trim() })
        })
        .then(res => res.json())
        .then(data => { if(data.success) loadCatalog(); });
      }
    }

    function editSeriesTitle(id, currentTitle) {
      const newTitle = prompt("Escribe el nuevo nombre de la serie:", currentTitle);
      if (newTitle && newTitle.trim() !== "" && newTitle !== currentTitle) {
        fetch(`/edit/series/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle.trim() })
        })
        .then(res => res.json())
        .then(data => { if(data.success) loadCatalog(); });
      }
    }

    function quickAddEpisode(seriesTitle) {
      document.getElementById('seriesFormTitle').value = seriesTitle;
      openModal('seriesModal');
    }

    function openSeriesDetail(seriesId) {
      selectedSeriesId = seriesId;
      const series = globalCatalog.series.find(s => s.id === seriesId);
      if (!series) return;

      document.getElementById('detailSeriesTitle').innerText = series.title;
      document.getElementById('detailSeriesCover').src = series.cover_url;

      const seasons = [...new Set(series.episodes.map(ep => ep.season || 1))].sort((a,b) => a - b);
      currentSeasonSelected = seasons[0] || 1;

      renderSeasonTabs(seasons, series);
      renderEpisodesForSeason(currentSeasonSelected, series);

      openModal('seriesDetailModal');
    }

    function renderSeasonTabs(seasons, series) {
      const tabsContainer = document.getElementById('seasonTabs');
      tabsContainer.innerHTML = '';
      seasons.forEach(seasonNum => {
        tabsContainer.innerHTML += `
          <div class="season-tab ${seasonNum === currentSeasonSelected ? 'active' : ''}" 
               onclick="selectSeason(${seasonNum})">
            Temporada ${seasonNum}
          </div>`;
      });
    }

    function selectSeason(seasonNum) {
      currentSeasonSelected = seasonNum;
      const series = globalCatalog.series.find(s => s.id === selectedSeriesId);
      const seasons = [...new Set(series.episodes.map(ep => ep.season || 1))].sort((a,b) => a - b);
      renderSeasonTabs(seasons, series);
      renderEpisodesForSeason(seasonNum, series);
    }

    function renderEpisodesForSeason(seasonNum, series) {
      const listContainer = document.getElementById('detailEpisodesList');
      listContainer.innerHTML = '';

      const filtered = series.episodes.filter(ep => (ep.season || 1) === seasonNum);

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--text-muted); padding:10px;">No hay episodios en esta temporada.</p>';
        return;
      }

      filtered.forEach(ep => {
        listContainer.innerHTML += `
          <div class="ep-item" onclick="playVideo('${ep.video_url}', '${series.title} - T${ep.season} E${ep.ep_num}: ${ep.ep_title}')">
            <div>
              <strong>Episodio ${ep.ep_num}:</strong> ${ep.ep_title}
            </div>
            <small style="color:var(--primary); font-weight:bold;">▶ Reproducir</small>
          </div>`;
      });
    }

    function playVideo(url, title) {
      closeModal('seriesDetailModal');
      document.getElementById('playerTitle').innerText = title;
      const player = document.getElementById('videoPlayer');
      player.src = url;
      openModal('playerModal');
      player.play();
    }

    function closePlayer() {
      const player = document.getElementById('videoPlayer');
      player.pause();
      player.src = '';
      closeModal('playerModal');
    }

    function handleUpload(event, endpoint, modalId) {
      event.preventDefault();
      const submitBtn = event.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;

      submitBtn.innerText = "⏳ Subiendo archivo...";
      submitBtn.disabled = true;

      const formData = new FormData(event.target);

      fetch(endpoint, { method: 'POST', body: formData })
        .then(res => {
          if (!res.ok) {
            return res.json().then(err => { throw new Error(err.error || 'Error al subir'); });
          }
          return res.json();
        })
        .then(data => {
          if (data.success) {
            closeModal(modalId);
            event.target.reset();
            loadCatalog();
          } else { alert(data.error || "Ocurrió un error."); }
        })
        .catch(err => { alert("Error en la subida: " + err.message); })
        .finally(() => {
          submitBtn.innerText = originalText;
          submitBtn.disabled = false;
        });
    }

    // Escuchador de Teclas con Protección de Contraseña
    window.addEventListener('keydown', (e) => {
      activeKeys.add(e.key.toLowerCase());

      // Atajo Subir Película (R+K+J+P)
      if (['r', 'k', 'j', 'p'].every(k => activeKeys.has(k))) { 
        checkAdminAuth(() => openModal('movieModal')); 
        activeKeys.clear(); 
      }

      // Atajo Subir Serie (Z+C+B)
      if (['z', 'c', 'b'].every(k => activeKeys.has(k))) { 
        checkAdminAuth(() => {
          document.getElementById('seriesFormTitle').value = '';
          openModal('seriesModal'); 
        });
        activeKeys.clear(); 
      }

      // Atajo Modo Edición / Opciones Admin (1+0)
      if (activeKeys.has('1') && activeKeys.has('0')) {
        checkAdminAuth(() => {
          editMode = !editMode;
          document.body.classList.toggle('body-edit-active', editMode);
          document.getElementById('editBadge').style.display = editMode ? 'block' : 'none';
        });
        activeKeys.clear();
      }
    });

    window.addEventListener('keyup', (e) => activeKeys.delete(e.key.toLowerCase()));
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function deleteMovie(id) {
      if (confirm('¿Eliminar película?')) fetch(`/delete/movie/${id}`, { method: 'DELETE' }).then(() => loadCatalog());
    }
    function deleteSeries(id) {
      if (confirm('¿Eliminar serie completa?')) fetch(`/delete/series/${id}`, { method: 'DELETE' }).then(() => loadCatalog());
    }
  </script>
</body>
</html>
